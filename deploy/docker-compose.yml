# mentor v1 Docker 部署编排
#
# 位置约定（与 scripts/deploy/deploy-remote.sh 一致）：
#   /opt/mentor/mentor-back/deploy/docker-compose.yml
#   /opt/mentor/mentor-back/deploy/.env        ← 服务器本地配置，不入库
#   /opt/mentor/mentor-web/                    ← 同级源码
#   /opt/mentor/mentor-mobile/                 ← 同级源码
#
# 常用命令（在 mentor-back 目录）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f mentor-back
#   docker compose -f deploy/docker-compose.yml run --rm mentor-back \
#     ./node_modules/.bin/ts-node prisma/seed.ts
#
# 首次部署、备份、回滚见 docs/部署-docker.md。

name: mentor

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-backend: &backend
  image: mentor-back:local
  build:
    context: ..
    dockerfile: deploy/docker/backend.Dockerfile

x-db-env: &db-env
  DATABASE_URL: mysql://${MYSQL_USER:-mentor}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-mentor_back}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?deploy/.env 缺少 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mentor_back}
      MYSQL_USER: ${MYSQL_USER:-mentor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?deploy/.env 缺少 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  # 一次性迁移：每次 up 先跑 prisma migrate deploy，成功后才启动后端
  migrate:
    <<: *backend
    restart: "no"
    env_file: [.env]
    environment:
      <<: *db-env
      NODE_ENV: production
      REDIS_URL: redis://redis:6379/0
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging

  mentor-back:
    <<: *backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379/0
      FILE_ROOT: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      # 只绑本机：宿主机 nginx 反代；健康检查也用这个口
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  mentor-web:
    image: mentor-web:local
    build:
      context: ../../mentor-web
      dockerfile: ../mentor-back/deploy/docker/frontend.Dockerfile
      args:
        API_ENV_VAR: VITE_API_BASE
        API_BASE: /api
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8081}:80"
    depends_on:
      - mentor-back
    logging: *default-logging

  mentor-mobile:
    image: mentor-mobile:local
    build:
      context: ../../mentor-mobile
      dockerfile: ../mentor-back/deploy/docker/frontend.Dockerfile
      args:
        API_ENV_VAR: VITE_API_BASE_URL
        API_BASE: /api
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MOBILE_PORT:-8082}:80"
    depends_on:
      - mentor-back
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  uploads: